services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: meowtrek
      MYSQL_USER: meowtrek
      MYSQL_PASSWORD: meowtrek
    ports:
      - "3307:3306"
    volumes:
      - meowtrek_mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  meowtrek_mysql:
